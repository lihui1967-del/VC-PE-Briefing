name: Daily VC Briefing

on:
  schedule:
    # UTC 22:23 → 台北/北京次日 06:23。避开 UTC 整点的全球拥堵时段。
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write        # 仅用于回写 state/ 和 out/

concurrency:
  group: daily-briefing
  cancel-in-progress: false   # 手动触发时不打断正在跑的定时任务

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          # 可选：配了才启用模型精炼层，没配就纯规则跑
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v5   # 版本号以 Marketplace 当前主版本为准
        with:
          name: briefing-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      # 回写去重状态。顺带产生仓库活动，
      # 防止 scheduled workflow 因 60 天无活动被自动禁用。
      - name: Persist state
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state/ out/
          git diff --staged --quiet || git commit -m "chore: daily run $(date -u +%F)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
        run: |
          curl -s -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
            -d "title=Daily VC Briefing 工作流失败" \
            -d "desp=脚本层告警未发出，说明是环境或推送通道本身的问题。%0A%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
